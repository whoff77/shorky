name: 'Shorky AI Test Auto-Healer'
description: 'Captures Playwright test failure telemetry, analyzes failures with AI, and automatically opens pull requests with code fixes.'
author: 'Shorky'
branding:
  icon: 'aperture'
  color: 'blue'

inputs:
  shorky-cloud-url:
    description: 'The URL of your shorky-cloud instance'
    required: false
    default: 'https://shorky-cloud.vercel.app'
  shorky-cloud-api-key:
    description: 'API key for authenticating with shorky-cloud'
    required: false
  openai-api-key:
    description: 'OpenAI API key used by Shorky to generate LLM-powered spec fixes locally'
    required: false
  github-token:
    description: 'GitHub token for PR generation fallback'
    required: true
    default: ${{ github.token }}
  report-path:
    description: 'Path to the Playwright JSON report file'
    required: false
    default: 'test-results/report.json'

runs:
  using: 'composite'
  steps:
    - name: Run Shorky Fix Analyzer on Failed Traces
      shell: bash
      env:
        SHORKY_CLOUD_URL: ${{ inputs.shorky-cloud-url }}
        SHORKY_CLOUD_API_KEY: ${{ inputs.shorky-cloud-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        echo "🔍 Resolving failed specs and traces from Playwright JSON report..."
        npx tsx "${{ github.action_path }}/src/cli/fixTrace.ts" --report "$REPORT_PATH"
