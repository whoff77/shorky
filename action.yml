name: 'Shorky AI Test Auto-Healer'
description: 'Captures Playwright test failure telemetry, analyzes failures with AI, and automatically opens pull requests with code fixes.'
author: 'Shorky'
branding:
  icon: 'aperture'
  color: 'blue'

inputs:
  shorky-cloud-url:
    description: 'Advanced/optional: base URL of a self-hosted or tunneled shorky-cloud instance (e.g. for local dev). Defaults to the hosted production instance; most consumers should leave this unset and only configure shorky-cloud-api-key.'
    required: false
    default: 'https://shorky-cloud.vercel.app'
  shorky-cloud-api-key:
    description: 'API key for authenticating with shorky-cloud'
    required: false
  openai-api-key:
    description: 'OpenAI API key used by Shorky to generate LLM-powered spec fixes locally'
    required: false
  github-token:
    description: 'GitHub token for PR generation fallback'
    required: true
    default: ${{ github.token }}
  report-path:
    description: 'Path to the Playwright JSON report file'
    required: false
    default: 'test-results/report.json'
  update-visual-baselines:
    description: >-
      "Auto-Accept Visual Baselines": when true, any visual regression (screenshot/pixel-diff) failure
      detected in the report has its local baseline PNG automatically overwritten with the newly captured
      "actual" screenshot from the failing run, and the updated baseline is staged into the batched
      auto-heal pull request. Defaults to false, which preserves the existing "flag for human review"
      behavior (no file is modified; the diff artifacts are only listed in the PR body for a human to
      review and accept/reject manually).
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install Shorky action dependencies
      shell: bash
      run: |
        echo "📦 Installing Shorky's own dependencies (unzipper, openai, dotenv, etc.) into ${{ github.action_path }}..."
        cd "${{ github.action_path }}"
        npm ci --no-audit --no-fund

    - name: Run Shorky Fix Analyzer on Failed Traces
      shell: bash
      env:
        SHORKY_CLOUD_URL: ${{ inputs.shorky-cloud-url }}
        SHORKY_CLOUD_API_KEY: ${{ inputs.shorky-cloud-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPORT_PATH: ${{ inputs.report-path }}
        # If the consuming project's Playwright globalSetup already minted a
        # shared SHORKY_RUN_ID (see shorky-test-consumer's global-setup.ts)
        # and exported it to $GITHUB_ENV, forward it here so fixTrace.ts
        # reuses that exact ID instead of falling back to reading it from
        # "<report-dir>/.shorky-run-id" or minting a new one. This keeps a
        # multi-worker Playwright run's batch report, consolidated PR, and
        # telemetry dispatch tagged with one single run identifier.
        SHORKY_RUN_ID: ${{ env.SHORKY_RUN_ID }}
        UPDATE_VISUAL_BASELINES: ${{ inputs.update-visual-baselines }}
      run: |
        echo "🔍 Resolving failed specs and traces from Playwright JSON report..."
        UPDATE_BASELINES_FLAG=""
        if [ "$UPDATE_VISUAL_BASELINES" = "true" ]; then
          echo "🖼️ Auto-Accept Visual Baselines enabled — visual regressions will have their baseline PNG automatically updated and staged in the PR."
          UPDATE_BASELINES_FLAG="--update-baselines"
        fi
        npx tsx "${{ github.action_path }}/src/cli/fixTrace.ts" --report "$REPORT_PATH" $UPDATE_BASELINES_FLAG
