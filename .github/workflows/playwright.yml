name: Shorky AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      - name: Run Shorky Playwright Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test --project="Google Chrome"

      - name: Run Shorky Fix Analyzer on Failed Traces
        if: failure() && github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🔍 Locating failed test traces..."
          find test-results -name "trace.zip" | while read -r TRACE_FILE; do
            echo "Processing trace: $TRACE_FILE"
            
            # Extract spec name from trace directory name (e.g. broken-login -> tests/broken-login.spec.ts)
            SPEC_NAME=$(echo "$TRACE_FILE" | sed -E 's|.*test-results/([^-]+)-.*|\1|')
            SPEC_PATH="tests/${SPEC_NAME}.spec.ts"
            
            echo "Targeting spec: $SPEC_PATH"
            npx tsx src/cli/fixTrace.ts --trace "$TRACE_FILE" --spec "$SPEC_PATH"
          done

      - name: Refactor Spec Source Files with Healed Selectors
        if: failure() && github.event_name == 'push'
        run: npx tsx scripts/apply-healed-selectors.ts

      - name: Create Pull Request for Healed Tests
        if: failure() && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(auto-heal): repair broken test locators"
          title: "fix(auto-heal): automated Playwright spec repair"
          branch: "shorky/auto-heal-selectors"
          base: "main"