name: Shorky AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      # 1. Run Playwright tests
      - name: Run Shorky Playwright Tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: "test-results/report.json"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p test-results
          npx playwright test --project="Google Chrome" --reporter=json,list

      # 2. Dispatch failure telemetry to shorky-cloud
      - name: Run Shorky Cloud Telemetry
        if: failure() && github.event_name == 'push'
        uses: ./
        with:
          shorky-cloud-url: ${{ vars.SHORKY_CLOUD_URL }}
          shorky-cloud-api-key: ${{ secrets.SHORKY_CLOUD_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-path: "test-results/report.json"