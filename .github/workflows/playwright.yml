name: Shorky AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      SHORKY_CLOUD_URL: ${{ vars.SHORKY_CLOUD_URL || 'https://shorky-cloud.vercel.app/api/v1/telemetry' }}
      SHORKY_CLOUD_API_KEY: ${{ secrets.SHORKY_CLOUD_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      # 1. Run Playwright tests (relies on playwright.config.ts for reporters)
      - name: Run Shorky Playwright Tests
        run: |
          mkdir -p test-results
          npx playwright test --project="Google Chrome"

      # 2. Dispatch failure telemetry / auto-heal logic via local action
      - name: Run Shorky Cloud Telemetry & Auto-Healer
        if: failure() && github.event_name == 'push'
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-path: "test-results/report.json"