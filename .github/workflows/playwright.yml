name: Shorky AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      SHORKY_CLOUD_URL: ${{ vars.SHORKY_CLOUD_URL || 'https://shorky-cloud.vercel.app' }}
      SHORKY_CLOUD_API_KEY: ${{ secrets.SHORKY_CLOUD_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 0. Run unit/mock tests (node:test, no external framework) — covers
      # src/cli/preflight.ts's budget-guard contract (200/402/429/fail-open).
      - name: Run unit tests
        run: npm test

      # 1. Run Playwright tests across the full browser matrix defined in
      # playwright.config.ts (Google Chrome, firefox, webkit) — no --project
      # flag here so CI always exercises cross-browser trace.zip parsing and
      # DOM snapshot extraction, even though local dev hardware may only be
      # able to run the Chromium project (see CLINE.md's Testing section).
      - name: Run Shorky Playwright Tests
        run: |
          mkdir -p test-results
          npx playwright test

      # 2. Dispatch failure telemetry / auto-heal logic via local action
      - name: Run Shorky Cloud Telemetry & Auto-Healer
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          shorky-cloud-api-key: ${{ secrets.SHORKY_CLOUD_API_KEY }}
          report-path: "test-results/report.json"
