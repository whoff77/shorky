name: Shorky AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      - name: Run Shorky Playwright Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test --project="Google Chrome"

      - name: Run Shorky Playwright Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test --project="Google Chrome"

      # Step 1: Run Shorky's trace fixer on failure to generate the fix
      - name: Run Shorky Fix Analyzer on Failed Trace
        if: failure() && github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx tsx src/cli/index.ts fix \
            --trace test-results/broken-login-user-should-be-able-to-log-in-Google-Chrome-retry2/trace.zip \
            --spec tests/broken-login.spec.ts

      # Step 2: Apply healed selectors (if your architecture uses a mapping script)
      - name: Refactor Spec Source Files with Healed Selectors
        if: always() && github.event_name == 'push'
        run: npx tsx scripts/apply-healed-selectors.ts

      # Step 3: Create PR with changes using peter-evans/create-pull-request
      - name: Create Pull Request for Healed Tests
        if: always() && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(auto-heal): repair broken selectors in spec"
          title: "fix(auto-heal): automated Playwright spec repair"
          branch: "shorky/auto-heal-selectors"
          base: "main"