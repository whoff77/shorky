name: Shorky AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      # 1. Run Playwright tests with JSON reporter output
      - name: Run Shorky Playwright Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: "test-results/report.json"
        run: |
          mkdir -p test-results
          npx playwright test --project="Google Chrome" --reporter=json,list || true

      - name: Run Shorky Fix Analyzer on Failed Traces
        if: failure() && github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🔍 Resolving failed specs and traces from Playwright JSON report..."

          npx tsx -e '
            import fs from "fs";
            import path from "path";
            import { execSync } from "child_process";

            const reportPath = "test-results/report.json";
            if (!fs.existsSync(reportPath)) {
              console.error("❌ No report.json found");
              process.exit(1);
            }

            const report = JSON.parse(fs.readFileSync(reportPath, "utf-8"));
            
            function findFailures(suite) {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  for (const result of test.results || []) {
                    if (result.status === "timedOut" || result.status === "failed") {
                      const relativeSpecPath = path.relative(process.cwd(), spec.file);
                      const traceAttachment = result.attachments?.find(a => a.name === "trace");
                      
                      if (traceAttachment && traceAttachment.path) {
                        console.log(`🎯 Found failed spec: ${relativeSpecPath}`);
                        console.log(`📦 Found trace zip: ${traceAttachment.path}`);
                        
                        const cmd = `npx tsx src/cli/fixTrace.ts --trace "${traceAttachment.path}" --spec "${relativeSpecPath}"`;
                        execSync(cmd, { stdio: "inherit" });
                      }
                    }
                  }
                }
              }
              for (const child of suite.suites || []) {
                findFailures(child);
              }
            }

            for (const suite of report.suites || []) {
              findFailures(suite);
            }
          '

      - name: Refactor Spec Source Files with Healed Selectors
        if: failure() && github.event_name == 'push'
        run: npx tsx scripts/apply-healed-selectors.ts

      - name: Create Pull Request for Healed Tests
        if: failure() && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(auto-heal): repair broken test locators"
          title: "fix(auto-heal): automated Playwright spec repair"
          branch: "shorky/auto-heal-selectors"
          base: "main"