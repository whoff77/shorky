name: Shorky AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      - name: Run Shorky Playwright Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test --project="Google Chrome"

      - name: Refactor Spec Source Files with Healed Selectors
        if: always()
        run: npx tsx scripts/apply-healed-selectors.ts

      - name: Create Self-Healing Pull Request
        uses: peter-evans/create-pull-request@v6
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          commit-message: "chore(shorky): auto-heal broken test selectors in source code"
          branch: "shorky/auto-heal-selectors"
          delete-branch: true
          title: "🤖 Shorky AI: Auto-Healed Selectors Proposed Code Fix"
          body: |
            ## 🩹 Shorky Self-Healing Report

            Shorky detected broken locators during this test run, repaired them using live DOM analysis, and updated the source `.spec.ts` files accordingly.

            ### Proposed Changes
            Review the file diff below. If the new locators accurately reflect your frontend UI, merge this PR to keep your test specs clean!
          labels: "automated-pr, shorky-ai"