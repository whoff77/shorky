name: Shorky AI Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome

      - name: Run Shorky Playwright Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx playwright test --project="Google Chrome"

      - name: Run Shorky Fix Analyzer on Failed Traces
        if: failure() && github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🔍 Locating failed test traces and matching specs..."

          find test-results -name "trace.zip" | while read -r TRACE_FILE; do
            TRACE_DIR=$(dirname "$TRACE_FILE")
            
            # 1. Extract the exact failing spec file from error-context.md or runner logs
            SPEC_PATH=$(grep -oE '[a-zA-Z0-9_\/-]+\.spec\.[tj]s' "$TRACE_DIR/error-context.md" | head -n 1)

            # 2. Fallback: search for any spec matching the folder prefix if error-context.md isn't present
            if [ -z "$SPEC_PATH" ]; then
              DIR_NAME=$(basename "$TRACE_DIR")
              SPEC_NAME=$(echo "$DIR_NAME" | cut -d'-' -f1)
              SPEC_PATH=$(find tests -name "${SPEC_NAME}*.spec.[tj]s" | head -n 1)
            fi

            if [ -n "$SPEC_PATH" ] && [ -f "$SPEC_PATH" ]; then
              echo "🎯 Target Spec Found: $SPEC_PATH"
              echo "📦 Trace File: $TRACE_FILE"
              
              npx tsx src/cli/fixTrace.ts --trace "$TRACE_FILE" --spec "$SPEC_PATH"
            else
              echo "⚠️ Could not automatically resolve spec file for trace in $TRACE_DIR"
            fi
          done

      - name: Refactor Spec Source Files with Healed Selectors
        if: failure() && github.event_name == 'push'
        run: npx tsx scripts/apply-healed-selectors.ts

      - name: Create Pull Request for Healed Tests
        if: failure() && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(auto-heal): repair broken test locators"
          title: "fix(auto-heal): automated Playwright spec repair"
          branch: "shorky/auto-heal-selectors"
          base: "main"